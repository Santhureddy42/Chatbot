services:
  - type: web
    name: gemini-rag-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_DOCUMENT_UPLOADS
        value: "false"
      - key: RAG_DEMO_MODE
        value: "true"
      - key: VECTOR_STORE_DIR
        value: /tmp/gemini-rag-vector-store
